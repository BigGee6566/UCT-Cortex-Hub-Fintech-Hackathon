[project]
name = "momali-backend"
version = "0.1.0"
description = "Mo'Mali API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug patterns, UP: modern syntax, S: security (bandit), SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed, fake passwords by design.
"tests/**" = ["S101", "S105", "S106"]
